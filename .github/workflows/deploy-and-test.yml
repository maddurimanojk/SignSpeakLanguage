name: Enterprise CI/CD Deployment and Live E2E Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://maddurimanojk.github.io/SignSpeakLanguage/' }}
  PYTHONPATH: .

jobs:
  build:
    name: Build Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Verify build output
        working-directory: web
        run: test -f dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-and-test:
    name: Verify Live Deployment and Run Selenium
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deployment
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://maddurimanojk.github.io/SignSpeakLanguage/' }}
        run: |
          echo "Testing live deployment: ${BASE_URL}"

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --max-time 30 \
            --output /tmp/home.html \
            "${BASE_URL}"

          test -s /tmp/home.html

          echo "HTTP 200 deployment verification passed."

      - name: Verify HTML contains application
        run: |
          grep -Eiq '<html|<body|<div' /tmp/home.html
          echo "Main HTML verification passed."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium openpyxl requests

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium live tests
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://maddurimanojk.github.io/SignSpeakLanguage/' }}
        run: |
          python -m pytest \
            automation/tests/test_selenium_suite.py \
            -v \
            --tb=short

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ github.run_number }}
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish execution summary
        if: always()
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://maddurimanojk.github.io/SignSpeakLanguage/' }}
        run: |
          {
            echo "# Live GitHub Pages E2E Execution Summary"
            echo
            echo "**Deployment URL:** ${BASE_URL}"
            echo
            echo "**Commit:** ${GITHUB_SHA}"
            echo
            echo "**Workflow Run:** ${GITHUB_RUN_NUMBER}"
            echo
            echo "QA artifacts are attached to this workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"
