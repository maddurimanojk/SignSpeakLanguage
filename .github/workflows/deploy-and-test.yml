name: Enterprise QA CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: https://maddurimanojk.github.io/SignSpeakLanguage/
  PYTHONPATH: .

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web App
        run: |
          cd web
          npm ci || npm install
          npx tsc --noEmit
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Verification Check
        run: |
          echo "Verifying LIVE target URL: ${{ env.BASE_URL }}"
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BASE_URL }} || echo "000")
          echo "Live HTTP Status Code: $HTTP_STATUS"

  qa-selenium:
    name: 🌐 Selenium — Website Tests (300)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest

      - name: Run Selenium Suite (300 Tests)
        continue-on-error: true
        run: |
          python -m pytest -v automation/tests/test_selenium_suite.py --junitxml=automation/reports/selenium_results.xml || true

      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selenium-qa-results
          path: automation/reports/

  qa-appium:
    name: 📱 Appium — Android Tests (300)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest

      - name: Run Appium Suite (300 Tests)
        continue-on-error: true
        run: |
          python -m pytest -v automation/tests/test_appium_suite.py --junitxml=automation/reports/appium_results.xml || true

      - name: Upload Appium Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appium-qa-results
          path: automation/reports/

  qa-unit:
    name: 🧪 Unit Tests — API (300)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA & Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest numpy pydantic

      - name: Run Unit Suite (300 Tests)
        continue-on-error: true
        run: |
          python -m pytest -v automation/tests/test_unit_suite.py --junitxml=automation/reports/unit_results.xml || true

      - name: Upload Unit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unit-qa-results
          path: automation/reports/

  qa-validation:
    name: ✅ Validation Tests (300)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest numpy

      - name: Run Validation Suite (300 Tests)
        continue-on-error: true
        run: |
          python -m pytest -v automation/tests/test_validation_suite.py --junitxml=automation/reports/validation_results.xml || true

      - name: Upload Validation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-qa-results
          path: automation/reports/

  qa-load:
    name: 📈 Load Testing — Performance (300)
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest

      - name: Run Load Suite (300 Tests)
        continue-on-error: true
        run: |
          python -m pytest -v automation/tests/test_load_suite.py --junitxml=automation/reports/load_results.xml || true

      - name: Upload Load Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: load-qa-results
          path: automation/reports/

  compile-report:
    name: 📊 Compile Master Report
    needs: [qa-selenium, qa-appium, qa-unit, qa-validation, qa-load]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest numpy pydantic

      - name: Download All QA Job Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Execute Master Report Compiler & Generate Excel Workbooks
        run: |
          python automation/run_enterprise_qa.py

      - name: Upload Final Master QA Reports
        uses: actions/upload-artifact@v4
        with:
          name: SignSpeak-AI-Master-QA-Artifacts
          path: |
            automation/reports/
          retention-days: 30

      - name: Publish GitHub Action Step Summary
        run: |
          if [ -f automation/reports/QA_AUDIT_REPORT.md ]; then
            cat automation/reports/QA_AUDIT_REPORT.md >> $GITHUB_STEP_SUMMARY
          fi
