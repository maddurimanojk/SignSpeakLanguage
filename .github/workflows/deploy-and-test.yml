name: Enterprise CI/CD Deployment & Live E2E Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://signspeak-ai.vercel.app' }}
  PYTHONPATH: .

jobs:
  build-deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Repository Checkout
      - name: Stage 1: Repository Checkout
        uses: actions/checkout@v4

      # Stage 2: Dependency Installation
      - name: Stage 2: Setup Node.js & Install Web Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Packages
        run: |
          cd web
          npm ci || npm install

      - name: Setup Python 3.10 & Install QA Automation Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python QA Automation Tools
        run: |
          python -m pip install --upgrade pip
          pip install selenium appium-python-client openpyxl pandas requests jinja2 beautifulsoup4 pytest

      # Stage 3: Build Application
      - name: Stage 3: Build Application
        run: |
          cd web
          npm run build

      # Stage 4: Static Analysis
      - name: Stage 4: Static Analysis & Type Checking
        run: |
          cd web
          npx tsc --noEmit

      # Stage 5: Deploy to GitHub Pages / Host
      - name: Stage 5: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Stage 6: Wait for Deployment
      - name: Stage 6: Wait for Deployment Readiness
        run: |
          echo "Waiting 15 seconds for LIVE deployment DNS & SSL to propagate..."
          sleep 15

      # Stage 7: Deployment Verification
      - name: Stage 7: Deployment Verification (HTTP 200 Check)
        run: |
          echo "Verifying LIVE Deployment URL: ${{ env.BASE_URL }}"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.BASE_URL }} || echo "000")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment Health Check Failed! Status Code: $HTTP_STATUS"
            exit 1
          fi
          echo "✓ Deployment verified successfully with HTTP 200 OK!"

      # Stage 8: Run Selenium E2E & Appium & QA Test Suites
      - name: Stage 8: Run Enterprise QA Test Suites (Selenium 440+ & Appium 300+)
        run: |
          python automation/run_enterprise_qa.py

      # Stage 9: Generate Reports
      - name: Stage 9: Generate HTML & Dashboard Reports
        run: |
          ls -la automation/reports/HTML/

      # Stage 10: Generate Excel Reports
      - name: Stage 10: Verify Excel Reports Generation
        run: |
          ls -la automation/reports/Excel/

      # Stage 11: Upload Artifacts (30-Day Retention)
      - name: Stage 11: Upload QA Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SignSpeak-AI-QA-Test-Artifacts
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 30

      # Stage 12: Publish Summary
      - name: Stage 12: Publish GitHub Actions Step Summary
        if: always()
        run: |
          cat automation/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY

      # Stage 13: Store Historical Results
      - name: Stage 13: Store Historical Results Metadata
        if: always()
        run: |
          mkdir -p .historical_results
          cp automation/reports/JSON/execution-results.json .historical_results/result-${{ github.run_id }}.json
          echo "Historical QA execution result archived."
